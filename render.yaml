services:
  - type: web
    name: ehf-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ehf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # User will need to set this to their Vercel URL

databases:
  - name: ehf-db
    plan: free
    postgresMajorVersion: 15
